<div class="chat-page">

  <!-- Avatar mascot -->
  <div class="baby">
    <img class="baby__image" [src]="avatarSrc" alt="Leo" />
  </div>

  <!-- Chat shell -->
  <div class="chat-shell" (mousedown)="onChatMouseDown()">

    <!-- Ambient glow layers -->
    <div class="chat-shell__glow chat-shell__glow--top"></div>
    <div class="chat-shell__glow chat-shell__glow--bottom"></div>

    <!-- Header -->
    <header class="chat-header">
      <div class="chat-header__info">
        <div class="chat-header__avatar">
          <img class="chat-header__avatar-img" src="assets/images/leo-avatar-new.jpg" alt="Leo" />
        </div>
        <div>
          <p class="chat-header__name">Talk with Leo</p>
          <p class="chat-header__status" [class.chat-header__status--online]="isConnected">
            <span class="chat-header__status-dot"></span>
            {{ isConnected ? 'Online' : 'Offline' }}
          </p>
        </div>
      </div>
      <div class="chat-header__badge">AI</div>
    </header>

    <!-- Messages -->
    <div class="chat-messages" #messagesContainer>
      <div *ngIf="messages.length === 0" class="chat-messages__empty">
        <img class="chat-messages__empty-avatar" src="assets/images/leo-avatar-new.jpg" alt="Leo" />
        <p class="chat-messages__empty-title">Hey, I'm Leo</p>
        <p class="chat-messages__empty-sub">Ask me anything — I'm here to help.</p>
      </div>

      <div *ngFor="let msg of messages" class="message" [class.message--user]="msg.role === 'user'"
        [class.message--assistant]="msg.role === 'assistant'">
        <div *ngIf="msg.role === 'assistant'" class="message__avatar">
          <img src="assets/images/leo-avatar-new.jpg" alt="Leo" />
        </div>
        <div class="message__bubble">
          <p class="message__text">{{ msg.content }}</p>
          <span class="message__time">{{ msg.timestamp | date:'HH:mm' }}</span>
        </div>
      </div>

      <div *ngIf="isLoading" class="message message--assistant">
        <div class="message__avatar">
          <img src="assets/images/leo-avatar-new.jpg" alt="Leo" />
        </div>
        <div class="message__bubble message__bubble--typing">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input" [class.chat-input--expanded]="inputExpanded">
      <textarea #chatInput class="chat-input__field" [(ngModel)]="userInput" (mousedown)="inputExpanded = true"
        (focus)="inputExpanded = true" (blur)="inputExpanded = !userInput.trim() ? false : inputExpanded"
        (keydown)="onKeydown($event)" placeholder="Message Leo…" rows="1"></textarea>
      <button class="chat-input__send" (click)="sendMessage()"
        [disabled]="!isConnected || isLoading || !userInput.trim()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

  </div>
</div>
