<div class="chat-shell">

  <!-- Header -->
  <header class="chat-header">
    <div class="chat-header__info">
      <div class="chat-header__avatar">AI</div>
      <div>
        <p class="chat-header__name">Claude Assistant</p>
        <p class="chat-header__status" [class.chat-header__status--online]="isConnected">
          {{ isConnected ? 'Connected' : 'Disconnected' }}
        </p>
      </div>
    </div>
  </header>

  <!-- Messages -->
  <div class="chat-messages" #messagesContainer>
    <div *ngIf="messages.length === 0" class="chat-messages__empty">
      <p>Start a conversation with Claude.</p>
    </div>

    <div
      *ngFor="let msg of messages"
      class="message"
      [class.message--user]="msg.role === 'user'"
      [class.message--assistant]="msg.role === 'assistant'"
    >
      <div class="message__bubble">
        <p class="message__text">{{ msg.content }}</p>
        <span class="message__time">{{ msg.timestamp | date:'HH:mm' }}</span>
      </div>
    </div>

    <div *ngIf="isLoading" class="message message--assistant">
      <div class="message__bubble message__bubble--typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input">
    <textarea
      class="chat-input__field"
      [(ngModel)]="userInput"
      (keydown)="onKeydown($event)"
      placeholder="Type a message… (Enter to send, Shift+Enter for new line)"
      rows="1"
      [disabled]="!isConnected || isLoading"
    ></textarea>
    <button
      class="chat-input__send"
      (click)="sendMessage()"
      [disabled]="!isConnected || isLoading || !userInput.trim()"
    >
      Send
    </button>
  </div>

</div>
